apiVersion: apps/v1
kind: Deployment
metadata:
  name: actions-lab
  labels:
    app.kubernetes.io/name: actions-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: actions-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: actions-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: local-kubernetes
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

